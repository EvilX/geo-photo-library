# CI: clippy и тесты, затем сборка RPM для Fedora 45 — в контейнере fedora:45, с теми же
# системными библиотеками (gtk4, libshumate, libheif), что и у целевой системы.
# Отдельно, на macOS: тесты ядра без GTK и образ диска (DMG) с нативным приложением.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Тесты (Fedora 45)
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      # git нужен до checkout, иначе actions/checkout скачает архив без .git.
      - name: Системные зависимости
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc cargo rust clippy \
            gtk4-devel libshumate-devel libheif-devel

      - uses: actions/checkout@v7

      - name: Кэш Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fedora45-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: fedora45-cargo-

      - name: Clippy
        run: cargo clippy --release --all-targets --locked --features ffi -- -D warnings

      # Фича ffi — C-интерфейс ядра для приложения macOS: его тесты не зависят от системы.
      - name: Тесты
        run: cargo test --release --locked --features ffi

  rpm:
    name: RPM (Fedora 45)
    needs: test
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - name: Системные зависимости
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc cargo rust rpm-build \
            gtk4-devel libshumate-devel libheif-devel \
            desktop-file-utils appstream

      - uses: actions/checkout@v7

      # Репозиторий в контейнере принадлежит другому пользователю — git иначе откажется работать.
      - name: Доверять каталогу репозитория
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Сборка RPM
        run: ./packaging/build-rpm.sh

      - uses: actions/upload-artifact@v7
        with:
          name: geo-photo-library-fc45-rpm
          path: target/rpmbuild/RPMS/x86_64/*.rpm
          if-no-files-found: error

  dmg:
    name: DMG (macOS)
    # Раннеры macOS — на Apple silicon: приложение и образ собираются только для arm64.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Кэш Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-

      # Ядро без GTK и libheif — как оно собирается для приложения.
      - name: Тесты ядра
        run: cargo test --release --locked --no-default-features --features ffi --lib

      - name: Сборка DMG
        run: ./macos/build-dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: geo-photo-library-macos-dmg
          path: target/macos/*.dmg
          if-no-files-found: error
