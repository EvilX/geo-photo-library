# CI: clippy и тесты, затем сборка RPM для Fedora 45 (x86_64 и aarch64) — в контейнере
# fedora:45, с теми же системными библиотеками (gtk4, libshumate, libheif), что и у целевой системы.
# После тестов — и пакеты deb для Ubuntu 24.04 и 26.04 (amd64 и arm64), в контейнерах этих выпусков.
# Отдельно, на macOS: тесты ядра без GTK и образ диска (DMG) с нативным приложением.
# На теге v* собранные RPM, DEB и DMG прикладываются к релизу GitHub (задача release),
# а RPM и DEB добавляются в репозитории dnf и apt на GitHub Pages (задача repo).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Тесты (Fedora 45)
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      # git нужен до checkout, иначе actions/checkout скачает архив без .git.
      - name: Системные зависимости
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc cargo rust clippy \
            gtk4-devel libshumate-devel libheif-devel

      - uses: actions/checkout@v7

      - name: Кэш Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fedora45-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: fedora45-cargo-

      - name: Clippy
        run: cargo clippy --release --all-targets --locked --features ffi -- -D warnings

      # Фича ffi — C-интерфейс ядра для приложения macOS: его тесты не зависят от системы.
      - name: Тесты
        run: cargo test --release --locked --features ffi

  rpm:
    name: RPM (Fedora 45, ${{ matrix.arch }})
    needs: test
    # Сборка нативная: образ fedora:45 есть для обеих архитектур, раннер задаёт нужную.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            artifact: geo-photo-library-fc45-rpm
          - arch: aarch64
            runner: ubuntu-24.04-arm
            artifact: geo-photo-library-fc45-aarch64-rpm
    runs-on: ${{ matrix.runner }}
    container: fedora:45
    steps:
      - name: Системные зависимости
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc cargo rust rpm-build \
            gtk4-devel libshumate-devel libheif-devel \
            desktop-file-utils appstream

      - uses: actions/checkout@v7

      # Репозиторий в контейнере принадлежит другому пользователю — git иначе откажется работать.
      - name: Доверять каталогу репозитория
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Сборка RPM
        run: ./packaging/build-rpm.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/rpmbuild/RPMS/${{ matrix.arch }}/*.rpm
          if-no-files-found: error

  deb:
    name: DEB (Ubuntu ${{ matrix.ubuntu }}, ${{ matrix.arch }})
    needs: test
    # Сборка нативная в контейнере нужного выпуска Ubuntu: зависимости пакета (dpkg-shlibdeps)
    # берутся из его библиотек.
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:${{ matrix.ubuntu }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Системные зависимости
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgtk-4-dev libshumate-dev libsoup-3.0-dev libheif-dev \
            dpkg-dev desktop-file-utils appstream

      # Rust в Ubuntu 24.04 (1.75) слишком старый для зависимостей — ставится через rustup.
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      - name: Кэш Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/deb
          key: ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}-cargo-

      - name: Сборка DEB
        run: ./packaging/build-deb.sh

      # Пакет ставится в ту же систему: проверка зависимостей и запуска.
      - name: Установка
        run: |
          apt-get install -y ./target/deb/*.deb
          geo-photo-library --scan /nonexistent || true

      - uses: actions/upload-artifact@v7
        with:
          name: geo-photo-library-ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}-deb
          path: target/deb/*.deb
          if-no-files-found: error

  dmg:
    name: DMG (macOS)
    # Раннеры macOS — на Apple silicon: приложение и образ собираются только для arm64.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Собранное приложение и образы (target/macos) не кэшировать: иначе в артефакт
      # и релиз попадают DMG всех прошлых версий.
      - name: Кэш Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/macos
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-

      # Ядро без GTK и libheif — как оно собирается для приложения.
      - name: Тесты ядра
        run: cargo test --release --locked --no-default-features --features ffi --lib

      - name: Сборка DMG
        run: ./macos/build-dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: geo-photo-library-macos-dmg
          path: target/macos/*.dmg
          if-no-files-found: error

  release:
    name: Файлы к релизу
    needs: [rpm, deb, dmg]
    # Только для тегов v*: на push в main и в pull request задача пропускается.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Иначе в релиз попали бы файлы с другим номером в имени.
      - name: Тег совпадает с версией в Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag=${GITHUB_REF_NAME#v}
          case "$version" in
            "$tag" | "$tag.0") ;;
            *) echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией $version в Cargo.toml"; exit 1 ;;
          esac

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # Релиз уже создан на GitHub — догрузить файлы; ещё нет (запушен только тег) — создать.
      - name: Загрузка в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber \
            || gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  repo:
    name: Репозитории dnf и apt (GitHub Pages)
    # После release: там проверено, что тег совпадает с версией.
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Два тега подряд не должны перезаписывать gh-pages одновременно.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends createrepo-c apt-utils gnupg rpm

      # Ключ подписи — секрет GPG_PRIVATE_KEY (закрытый ключ в ASCII, без пароля).
      - name: Ключ подписи
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::Нет секрета GPG_PRIVATE_KEY — репозитории не подписать"; exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # Пакеты прошлых версий лежат в ветке gh-pages; её ещё нет — начинается с пустого сайта.
      - name: Текущий сайт
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git clone --depth 1 --branch gh-pages "$url" site || { mkdir site; git -C site init -b gh-pages; }
          git -C site remote set-url origin "$url" 2>/dev/null || git -C site remote add origin "$url"

      - name: Сборка репозиториев
        run: ./packaging/build-repo.sh dist site

      # Ветка — всегда из одного коммита: иначе удалённые старые пакеты оставались бы
      # в истории и репозиторий рос бы с каждым выпуском.
      - name: Публикация в gh-pages
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish
          git add -A
          git commit -q -m "Пакеты $GITHUB_REF_NAME"
          git push --force origin publish:gh-pages
