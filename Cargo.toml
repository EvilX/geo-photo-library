[package]
name = "geo-photo-library"
version = "1.1.1"
edition = "2021"
description = "Каталогизатор фотографий с поиском по карте"

[features]
default = ["gtk-ui", "heic"]
# Интерфейс GTK4 (Linux). Без него собирается только ядро — библиотека для
# нативного интерфейса macOS (см. macos/).
gtk-ui = ["dep:gtk", "dep:shumate", "dep:soup3", "dep:async-channel"]
heic = ["dep:libheif-rs"]
# C-интерфейс ядра (src/ffi.rs) для приложения на Swift.
ffi = []

[[bin]]
name = "geo-photo-library"
required-features = ["gtk-ui"]

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"], optional = true }
shumate = { package = "libshumate", version = "0.7", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
kamadak-exif = "0.6"
libheif-rs = { version = "2", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "rayon"] }
walkdir = "2"
rayon = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
async-channel = { version = "2", optional = true }
anyhow = "1"
blake3 = "1"
mozjpeg = "0.10.13"
libc = "0.2"
soup3 = { version = "0.8", optional = true }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2

