[package]
name = "geo-photo-library"
version = "0.7.0"
edition = "2021"
description = "Каталогизатор фотографий с поиском по карте"

[features]
default = ["heic"]
heic = ["dep:libheif-rs"]

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
shumate = { package = "libshumate", version = "0.7" }
rusqlite = { version = "0.37", features = ["bundled"] }
kamadak-exif = "0.6"
libheif-rs = { version = "2", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "rayon"] }
walkdir = "2"
rayon = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
async-channel = "2"
anyhow = "1"
blake3 = "1"
mozjpeg = "0.10.13"
libc = "0.2"
soup3 = "0.8"
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2

