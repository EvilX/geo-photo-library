[package]
name = "geo-photo-library"
version = "1.3.6"
edition = "2021"
description = "Photo catalog with map search by EXIF GPS coordinates"
license = "Apache-2.0"
repository = "https://github.com/EvilX/geo-photo-library"

[features]
default = ["gtk-ui", "heic"]
# GTK4 interface (Linux, Windows). Without it only the core is built — the library for
# the native macOS interface (see macos/).
gtk-ui = ["dep:gtk", "dep:shumate", "dep:soup3", "dep:async-channel"]
heic = ["dep:libheif-rs"]
# C interface of the core (src/ffi.rs) for the Swift app.
ffi = []

[[bin]]
name = "geo-photo-library"
required-features = ["gtk-ui"]

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"], optional = true }
shumate = { package = "libshumate", version = "0.7", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
kamadak-exif = "0.6"
# Writing GPS coordinates into JPEG, HEIC and WebP (kamadak-exif can only read).
little_exif = "0.6.23"
# Only libheif 1.17 functions are needed, so it also builds on Ubuntu 24.04 (by default the crate requires the newest one).
libheif-rs = { version = "2", default-features = false, features = ["v1_17"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "rayon"] }
walkdir = "2"
rayon = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
async-channel = { version = "2", optional = true }
anyhow = "1"
blake3 = "1"
mozjpeg = "0.10.13"
libc = "0.2"
soup3 = { version = "0.8", optional = true }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2

